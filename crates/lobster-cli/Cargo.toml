[package]
name = "lobster-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lobster command-line interface (file.md section 4)"
default-run = "lobster"

[[bin]]
name = "lobster"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
lobster-source = { path = "../lobster-source" }
lobster-diagnostics = { path = "../lobster-diagnostics" }
lobster-lexer = { path = "../lobster-lexer" }
lobster-parser = { path = "../lobster-parser" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
