<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140" role="img" aria-labelledby="bdTitle bdDesc">
  <title id="bdTitle">Generic processing pipeline</title>
  <desc id="bdDesc">Four stages left to right: source, transform, verify, emit.</desc>
  <style>
    rect { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
    text { font-family: sans-serif; font-size: 13px; fill: #222222; }
    .lbl { text-anchor: middle; }
    line { stroke: #333333; stroke-width: 1.5; }
    polyline { fill: none; stroke: #333333; stroke-width: 1.5; }
  </style>
  <rect x="10" y="45" width="130" height="50" rx="4"/>
  <text class="lbl" x="75" y="73">source</text>
  <rect x="180" y="45" width="130" height="50" rx="4"/>
  <text class="lbl" x="245" y="73">transform</text>
  <rect x="350" y="45" width="130" height="50" rx="4"/>
  <text class="lbl" x="415" y="73">verify</text>
  <rect x="520" y="45" width="110" height="50" rx="4"/>
  <text class="lbl" x="575" y="73">emit</text>
  <line x1="140" y1="70" x2="180" y2="70"/>
  <polyline points="172,64 180,70 172,76"/>
  <line x1="310" y1="70" x2="350" y2="70"/>
  <polyline points="342,64 350,70 342,76"/>
  <line x1="480" y1="70" x2="520" y2="70"/>
  <polyline points="512,64 520,70 512,76"/>
</svg>
